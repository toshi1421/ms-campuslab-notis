version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: campuslab-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: campuslab
      RABBITMQ_DEFAULT_PASS: rabbitmq123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  ms-notificaciones:
    build: .
    container_name: ms-campuslab-notis
    restart: always
    ports:
      - "8084:8084"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=campuslab
      - SPRING_RABBITMQ_PASSWORD=rabbitmq123
      - SPRING_MAIL_USERNAME=darlyneezamorano@gmail.com
      - SPRING_MAIL_PASSWORD=pjxc nmzv wfpe wxcs
    depends_on:
      - rabbitmq

volumes:
  rabbitmq_data: